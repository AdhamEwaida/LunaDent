name: Refresh Vite lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, 'Upgrade Vite to 7.3.6')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --save-dev vite@7.3.6

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
          else
            git commit -m "Refresh lockfile for Vite 7.3.6"
            git push
          fi
